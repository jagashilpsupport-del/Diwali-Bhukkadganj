<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhukkadganj Diwali Surprise</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d0716;--bg2:#4a1230;--gold:#ffc83d;--saff:#ff8a1f;--cream:#fff1d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 100%,var(--bg2),var(--bg) 70%);color:var(--cream);font-family:Mukta,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.lantern{position:fixed;bottom:-60px;width:26px;height:34px;z-index:0;animation:up linear infinite;opacity:.8}
@keyframes up{to{transform:translateY(-115vh) translateX(24px)}}
header,.wrap,.diyas{position:relative;z-index:1}
.brand{font-family:'Yatra One',Georgia,serif;font-size:1.15rem;color:var(--gold);margin:18px 0 0;text-align:center}
.sub{margin:2px 0 0;font-size:.85rem;opacity:.75;text-align:center}
.logo{display:block;height:118px;width:auto;filter:drop-shadow(0 0 18px #ff8a1f88)}
.wrap{width:min(94vw,380px);margin-top:4px}
#stage{width:100%;height:auto;display:block;transition:opacity .8s}
.s4 #stage{opacity:.18}
#tap{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);padding:12px 26px;border:0;border-radius:30px;background:linear-gradient(#ffd45c,#ff8a1f);color:#4a1230;font:600 1.05rem Mukta,sans-serif;box-shadow:0 0 0 0 #ffc83d99;animation:pulse 1.6s infinite;cursor:pointer;white-space:nowrap}
#tap:focus-visible{outline:3px solid #fff}
@keyframes pulse{70%{box-shadow:0 0 0 16px #ffc83d00}100%{box-shadow:0 0 0 0 #ffc83d00}}
.go #tap{display:none}
#match{transform:translate(-240px,60px);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.go #match{transform:translate(0,0)}
.flame{opacity:0;transform-origin:center bottom}
.s1 .flame{opacity:1;animation:fl .25s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.15,.9)}}
#fuse{stroke-dasharray:100;stroke-dashoffset:0}
.s2 #fuse{transition:stroke-dashoffset .8s linear;stroke-dashoffset:-100}
#spark{opacity:0;offset-path:path("M150 492 C158 490 168 482 176 470");offset-distance:0%}
.s2 #spark{opacity:1;animation:run .8s linear forwards}
@keyframes run{to{offset-distance:100%}}
.s2 #match{transition:opacity .4s .2s;opacity:0}
#rocket{transition:transform 1.1s cubic-bezier(.5,0,.9,.6),opacity .1s 1.1s}
.s3 #rocket{transform:translateY(-370px);opacity:0}
#exh{opacity:0}.s3 #exh{opacity:1;animation:fl .1s infinite alternate}
#flash{opacity:0;transform-origin:180px 110px}
.s4 #flash{animation:fl2 .7s ease-out forwards}
@keyframes fl2{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(3)}}
.p{opacity:0;stroke-linecap:round}
.s4 .p{animation:pf 1.6s ease-out forwards}
@keyframes pf{0%{opacity:1;transform:translate(0,0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 40px))}}
#reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px;pointer-events:none}
.wish{font-family:'Yatra One',Georgia,serif;font-size:2.5rem;line-height:1.05;color:var(--gold);margin:0;opacity:0;transform:scale(.5);text-shadow:0 0 24px #ff8a1fcc}
.from{margin:4px 0 14px;font-size:.9rem;opacity:0}
.win{font-family:'Yatra One',Georgia,serif;font-size:1.5rem;margin:0;opacity:0;transform:translateY(10px)}
.prize{opacity:0;transform:translateY(12px) scale(.85)}
.prize svg{width:110px;height:110px;display:block;margin:0 auto}
.pname{font-family:'Yatra One',Georgia,serif;font-size:2.1rem;line-height:1.1;color:var(--gold);margin-top:2px}
.note,.code,.info{opacity:0;transition:opacity .6s}
.note{margin:10px 0 0;font-size:.95rem}
.code{display:inline-block;margin:10px auto 0;padding:6px 14px;border:1.5px dashed var(--gold);border-radius:8px;color:var(--gold);font-weight:600;letter-spacing:.12em}
.info{font-size:.78rem;margin-top:8px}
.r1 .wish{opacity:1;transform:none;transition:all .7s cubic-bezier(.2,1.4,.4,1)}
.r1 .from{opacity:.85;transition:opacity .7s .3s}
.r2 .win{opacity:1;transform:none;transition:all .5s}
.r3 .prize{opacity:1;transform:none;transition:all .6s cubic-bezier(.2,1.4,.4,1)}
.r3 .note,.r3 .code{opacity:1}.r3 .info{opacity:.6}
.diyas{display:flex;gap:26px;margin:auto 0 18px;padding-top:8px}
.diyas svg{width:38px;height:28px;overflow:visible}
.diyas .f{transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate}
.diyas svg:nth-child(2n) .f{animation-delay:.15s}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:5;padding:6px 12px;border:1.5px solid var(--gold);border-radius:20px;background:#1d0716cc;color:var(--gold);font:600 .8rem Mukta,sans-serif;cursor:pointer}
#snd:focus-visible{outline:3px solid #fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.lantern{display:none}}
</style>
</head>

<script>
(function(){
var LIM={og:1,momo:1,coffee:10},W={og:2,momo:4,coffee:34,none:60};
var NAMES={og:'OG Burger',momo:'Lahori Momo',coffee:'Filter Coffee'};
var ICONS={
og:'<svg viewBox="0 0 120 120"><path d="M20 52C20 28 40 16 60 16s40 12 40 36z" fill="#e59a3a"/><g fill="#fff1d6"><circle cx="42" cy="30" r="2"/><circle cx="62" cy="24" r="2"/><circle cx="80" cy="32" r="2"/></g><path d="M16 56q11 10 22 0t22 0 22 0 22 0v6H16z" fill="#7fb83e"/><rect x="18" y="62" width="84" height="12" rx="6" fill="#5a2a14"/><path d="M18 74h84l-8 8H26z" fill="#ffc83d"/><path d="M20 84h80v8q0 14-14 14H34q-14 0-14-14z" fill="#e59a3a"/></svg>',
momo:'<svg viewBox="0 0 120 120"><ellipse cx="60" cy="100" rx="46" ry="8" fill="#0003"/><path d="M14 84q0-44 34-44 20 0 24 24 4-8 12-6 18 6 18 26z" fill="#fff1d6" stroke="#e3c58f" stroke-width="2"/><g stroke="#e3c58f" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M30 78q4-22 20-30M44 80q2-18 14-26M58 80q0-10 6-18"/></g><circle cx="92" cy="40" r="5" fill="#d7263d"/></svg>',
coffee:'<svg viewBox="0 0 120 120"><path d="M34 30q-6-10 0-18M52 30q-6-10 0-18M70 30q-6-10 0-18" stroke="#ffe3b0" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/><path d="M26 38h58v36q0 20-20 20H46q-20 0-20-20z" fill="#fff1d6"/><path d="M84 46h8q12 0 12 12t-12 12h-8" fill="none" stroke="#fff1d6" stroke-width="7"/><path d="M26 44h58v12H26z" fill="#6b3a1e"/><ellipse cx="55" cy="104" rx="46" ry="6" fill="#0003"/></svg>'
};
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var $=function(i){return document.getElementById(i)};

/* diyas + lanterns */
var dy=document.querySelector('.diyas');
for(var i=0;i<5;i++)dy.innerHTML+='<svg viewBox="0 0 38 28"><path d="M2 12h34q0 14-17 14T2 12z" fill="#c0541f"/><path d="M2 12h34" stroke="#ffc83d" stroke-width="2"/><g class="f"><path d="M19 12C12 6 16 0 19-6c3 6 7 12 0 18z" fill="#ff8a1f"/><path d="M19 10c-3-3-1-6 0-9 2 3 3 6 0 9z" fill="#ffe27a"/></g></svg>';
for(i=0;i<5;i++){var L=document.createElement('div');L.className='lantern';
L.style.left=(8+i*20)+'%';L.style.animationDuration=(16+i*3)+'s';L.style.animationDelay=(-i*4)+'s';
L.innerHTML='<svg viewBox="0 0 26 34"><path d="M5 6h16l3 20H2z" fill="#ff8a1f"/><path d="M5 6h16l3 20H2z" fill="#ffe27a" opacity=".35"/><rect x="4" y="3" width="18" height="4" rx="2" fill="#c0541f"/><rect x="7" y="26" width="12" height="4" rx="2" fill="#c0541f"/></svg>';document.body.appendChild(L)}

/* background canvas: embers + small fireworks */
var cv=$('bg'),cx=cv.getContext('2d'),P=[],E=[],cw,ch;
function size(){cw=cv.width=innerWidth;ch=cv.height=innerHeight}size();addEventListener('resize',size);
var cols=['#ffc83d','#ff8a1f','#ff5a6e','#fff1d6','#b6f0ff'];
for(i=0;i<45;i++)E.push({x:Math.random()*cw,y:Math.random()*ch,r:Math.random()*1.8+.4,v:Math.random()*.5+.2,p:Math.random()*6});
function burst(x,y,n,sp){var c=cols[Math.random()*cols.length|0];for(var k=0;k<n;k++){var a=k/n*6.283,s=sp*(.6+Math.random()*.5);P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:c})}}
var last=0;
function loop(t){
  cx.clearRect(0,0,cw,ch);
  E.forEach(function(e){e.y-=e.v;e.x+=Math.sin(t/900+e.p)*.3;if(e.y<-5){e.y=ch+5;e.x=Math.random()*cw}
    cx.globalAlpha=.55;cx.fillStyle='#ffb347';cx.beginPath();cx.arc(e.x,e.y,e.r,0,6.283);cx.fill()});
  if(t-last>1500){last=t;burst(cw*(.15+Math.random()*.7),ch*(.08+Math.random()*.35),30,2.6)}
  P=P.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.035;p.vx*=.985;p.l-=.011;
    if(p.l>0){cx.globalAlpha=p.l;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,2.2,2.2)}return p.l>0});
  requestAnimationFrame(loop)}
if(!reduce)requestAnimationFrame(loop);

/* sky shot burst sparks */
var sp=$('sparks'),sc=['#ffc83d','#ff8a1f','#fff1d6','#ff5a6e','#7fd6ff'];
for(i=0;i<36;i++){var a=i/36*6.283,r=(i%2?70:115)+Math.random()*25,l=document.createElementNS('http://www.w3.org/2000/svg','line');
l.setAttribute('x1',Math.cos(a)*8);l.setAttribute('y1',Math.sin(a)*8);l.setAttribute('x2',Math.cos(a)*24);l.setAttribute('y2',Math.sin(a)*24);
l.setAttribute('stroke',sc[i%5]);l.setAttribute('stroke-width',3);l.setAttribute('class','p');
l.style.setProperty('--x',Math.cos(a)*r+'px');l.style.setProperty('--y',Math.sin(a)*r+'px');sp.appendChild(l)}

/* prize logic */
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date())}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function leftFrom(d){var o={};for(var k in LIM)o[k]=LIM[k]-(d&&d[k]||0);return o}
function pick(left){var k,t=0,keys=[];for(k in W)if(k==="none"||left[k]>0){keys.push(k);t+=W[k]}
  if(!keys.length)return null;var r=Math.random()*t;for(var j=0;j<keys.length;j++){r-=W[keys[j]];if(r<=0)return keys[j]}return keys[keys.length-1]}
async function claimShared(db,day){
  var ref=db.doc('claims/'+day),me='h'+Math.random().toString(36).slice(2);
  for(var n=0;n<8;n++){
    var r=await ref.acquire({holder:me,ttlMs:4000});
    if(!r.acquired){await sleep(250+Math.random()*450);continue}
    var snap=await ref.get(),d=snap.exists?snap.data():{},p=pick(leftFrom(d));
    if(p&&p!=="none"){var nd={og:d.og||0,momo:d.momo||0,coffee:d.coffee||0};nd[p]++;await ref.set(nd)}
    return p||'none'}
  return 'busy'}
function claimLocal(day){var key='bg_cnt_'+day,d={};try{d=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
  var p=pick(leftFrom(d));if(p&&p!=='none'){d[p]=(d[p]||0)+1;try{localStorage.setItem(key,JSON.stringify(d))}catch(e){}}return p||'none'}
async function claim(){
  var day=today(),key='bg_won_'+day,saved=null;
  try{saved=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
  if(saved)return saved;
  var db=null,res;
  try{db=window.claude&&await Promise.race([claude.use('db'),sleep(2500).then(function(){return null})])}catch(e){}
  try{res=db?await claimShared(db,day):claimLocal(day)}catch(e){res=claimLocal(day)}
  var out={prize:res,code:'BG-'+day.slice(8)+day.slice(5,7)+'-'+Math.random().toString(36).slice(2,6).toUpperCase()};
  if(res!=='busy'){try{localStorage.setItem(key,JSON.stringify(out))}catch(e){}}
  return out}

function show(o){
  var p=o.prize,w=$('wrap');
  if(NAMES[p]){$('picon').innerHTML=ICONS[p];$('pname').textContent=NAMES[p];
    $('note').textContent='Show this screen at the counter. Valid today only.';$('code').textContent=o.code;$('info').textContent='One prize per customer per day'}
  else if(p==='busy'){$('win').textContent='Many people are scanning right now.';$('pname').textContent='Please scan again';$('note').textContent='Happy Diwali from all of us.'}
  else{var F=['Is baar kismat chhutti pe hai. Agle saal pakka milega!','Cracker phoot gaya, kismat nahi phooti. Mithai kha lo!','Laxmi ji abhi traffic mein hain. Kal dobara aana!','Gift nahi mila, par Diwali ki muskaan free hai!','Aaj ka prize: ek badi si smile. GST free!'];
    var wi=$('win');wi.textContent=F[Math.random()*F.length|0];wi.style.fontSize='1.25rem';wi.style.lineHeight='1.3';wi.style.maxWidth='300px';
    $('pname').textContent='';$('note').textContent='Phir bhi Bhukkadganj mein khane zaroor aana!'}
  w.classList.add('r1');setTimeout(function(){w.classList.add('r2')},900);setTimeout(function(){w.classList.add('r3')},1700);if(NAMES[p])setTimeout(sfx.win,1700);else if(p!=='busy')setTimeout(sfx.funny,900)}

/* sound effects (synthesised, no files) */
var AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function noise(dur,type,f0,f1,vol,delay){var a=ac();if(!a||muted)return;var t=a.currentTime+(delay||0),n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=Math.random()*2-1;var s=a.createBufferSource();s.buffer=b;var fl=a.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
  var g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t)}
function tone(type,f0,f1,dur,vol,delay){var a=ac();if(!a||muted)return;var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)}
var sfx={
  scratch:function(){noise(.4,'highpass',2000,5000,.25)},
  whoomp:function(){noise(.3,'lowpass',1800,200,.3);tone('sine',140,60,.25,.25)},
  fuse:function(){noise(.8,'highpass',3500,6000,.1);for(var k=0;k<10;k++)noise(.03,'highpass',4000,7000,.25,k*.08+Math.random()*.05)},
  launch:function(){noise(1.1,'bandpass',400,2600,.35);tone('sine',500,1900,1.1,.07)},
  boom:function(){noise(1.2,'lowpass',2800,80,.8);tone('sine',130,40,.7,.7);for(var k=0;k<14;k++)noise(.05,'highpass',5000,8000,.18,.15+Math.random()*1.2)},
  win:function(){[523,659,784,1047].forEach(function(x,i){tone('triangle',x,x,.35,.22,i*.11)})},
  funny:function(){tone('sawtooth',330,300,.28,.14);tone('sawtooth',300,270,.28,.14,.3);tone('sawtooth',270,240,.28,.14,.6);tone('sawtooth',240,120,.7,.16,.9)}
};
$('snd').addEventListener('click',function(){muted=!muted;this.textContent='Sound: '+(muted?'Off':'On');if(!muted)ac()});

var started=false;
$('tap').addEventListener('click',function(){
  if(started)return;started=true;ac();
  var w=$('wrap'),res=claim(),T=function(f,ms){setTimeout(f,ms)};
  if(reduce){w.classList.add('go','s4');res.then(show);return}
  w.classList.add('go');
  T(sfx.scratch,700);
  T(function(){w.classList.add('s1');sfx.whoomp()},1300);
  T(function(){w.classList.add('s2');sfx.fuse()},1700);
  T(function(){w.classList.add('s3');sfx.launch()},2500);
  T(function(){w.classList.add('s4');burst(cw/2,ch*.3,50,3.4);sfx.boom()},3600);
  T(function(){res.then(show)},4000);
});
})();
